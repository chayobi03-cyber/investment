name: Auto Market Monitor V1

on:
  schedule:
    - cron: "30 23 * * 0-4" # 08:30 KST, Mon-Fri
    - cron: "30 0 * * 1-5"  # 09:30 KST, Mon-Fri
    - cron: "30 1 * * 1-5"  # 10:30 KST, Mon-Fri
    - cron: "30 5 * * 1-5"  # 14:30 KST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install market-data adapter
        run: python -m pip install --upgrade pip yfinance pandas
      - name: Run fail-closed market monitor
        run: PYTHONPATH=. python scripts/auto_market_monitor_v1.py
      - name: Upload decision artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-market-monitor-${{ github.run_id }}
          path: artifacts/auto_market_monitor/latest.json
          if-no-files-found: error
