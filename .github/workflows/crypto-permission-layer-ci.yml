name: crypto-permission-layer-ci

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/crypto_permission_layer_v0.1.json"
      - "schemas/crypto_permission_layer_v0.1.schema.json"
      - "scripts/crypto/fetch_multi_asset_daily.py"
      - "scripts/crypto/validate_permission_layer_pit.py"
      - "src/investment_pipeline/crypto_permission.py"
      - "tests/test_crypto_permission_layer.py"
      - "tests/test_crypto_permission_overlay.py"
      - ".github/workflows/crypto-permission-layer-ci.yml"
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

jobs:
  permission-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q             tests/test_crypto_permission_layer.py             tests/test_crypto_permission_overlay.py

      - name: Validate contract JSON
        run: |
          python - <<'PY'
          import json
          json.load(open("config/crypto_permission_layer_v0.1.json", encoding="utf-8"))
          json.load(open("schemas/crypto_permission_layer_v0.1.schema.json", encoding="utf-8"))
          cfg = json.load(open("config/crypto_permission_layer_v0.1.json", encoding="utf-8"))
          assert cfg["promotion"]["buy_allowed"] is False
          print("contract_json=PASS")
          PY

      - name: Fetch BTC ETH SOL cross-asset history
        run: |
          rm -rf artifacts/crypto_permission
          python scripts/crypto/fetch_multi_asset_daily.py             --days 3000             --out artifacts/crypto_permission/cross_asset_1d.csv

      - name: Normalize cross-asset PIT
        run: |
          python - <<'PY'
          import pandas as pd
          p = "artifacts/crypto_permission/cross_asset_1d.csv"
          df = pd.read_csv(p).rename(columns={"timestamp":"observation_timestamp"})
          df["source_id"] = "COINBASE_EXCHANGE"
          df["unit"] = "USD_OHLCV"
          df["value"] = df["close"]
          df["ingested_at"] = pd.Timestamp.now(tz="UTC").isoformat()
          df[[
              "asset","series_id","observation_timestamp","available_at",
              "source_id","unit","value","ingested_at"
          ]].to_csv("artifacts/crypto_permission/cross_asset_pit.csv", index=False)
          PY

      - name: Validate PIT rules
        env:
          PYTHONPATH: .
        run: |
          python scripts/crypto/validate_permission_layer_pit.py             artifacts/crypto_permission/cross_asset_pit.csv

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crypto-permission-layer-${{ github.run_id }}
          path: artifacts/crypto_permission
          retention-days: 14
