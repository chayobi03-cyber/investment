name: JPY overlay seven-window replay
on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests tabulate
      - name: Run JPY overlay replay
        run: python research/scripts/run_jpy_overlay_replay.py
      - name: Upload replay results
        uses: actions/upload-artifact@v4
        with:
          name: jpy-overlay-seven-window-results
          path: research/results/jpy_overlay_replay/
