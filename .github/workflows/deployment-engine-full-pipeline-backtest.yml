name: Deployment engine v0.1 full pipeline backtest
on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run full pipeline backtest
        run: python research/scripts/run_deployment_engine_v0.1_full_pipeline_backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: deployment-engine-v0.1-full-pipeline-results
          path: research/results/deployment_engine_v0.1_full_pipeline/
