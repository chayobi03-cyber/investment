name: KRX factor pipeline (completeness -> raw -> normalized)
on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pykrx lxml requests
      - name: Run KRX factor pipeline
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python research/scripts/run_krx_factor_pipeline.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: krx-factor-pipeline-results
          path: research/results/krx_factor_pipeline/
