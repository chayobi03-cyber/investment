name: korea-layer-backtest

on:
  push:
    branches: ['research/korea-layer-backtest-v0.1']
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research data stack
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy pandas-datareader FinanceDataReader
      - name: Run Korea Layer historical backtest
        run: python scripts/backtest_korea_layer.py | tee /tmp/korea_layer_metrics.json
      - name: Upload backtest evidence
        uses: actions/upload-artifact@v4
        with:
          name: korea-layer-backtest-v0.1
          path: artifacts/korea_layer_backtest/
          if-no-files-found: error
