name: research-ci

on:
  push:
    branches: [main, 'research/**']
  pull_request:
    branches: [main]

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Run capital matrix harness
        run: python scripts/run_capital_matrix.py > /tmp/capital_matrix.json
      - name: Validate capital matrix coverage
        run: |
          python - <<'PY'
          import json
          d = json.load(open('/tmp/capital_matrix.json'))
          assert d['case_count'] == 12
          assert len(d['cases']) == 12
          print('capital matrix: 12/12 cases')
          PY
      - name: Run stress matrix harness
        run: python scripts/run_stress_matrix.py > /tmp/stress_matrix.json
      - name: Validate stress matrix coverage
        run: |
          python - <<'PY'
          import json
          d = json.load(open('/tmp/stress_matrix.json'))
          assert d['case_count'] == 12
          assert d['scenario_count'] == 5
          assert d['result_count'] == 60
          print('stress matrix: 12 cases x 5 scenarios = 60 results')
          PY

  m1b_ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run real baseline historical ingest
        run: python scripts/ingest_baseline_history.py
      - name: Upload M1-B machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1b-baseline-evidence
          path: artifacts/baseline_history/
          if-no-files-found: error
