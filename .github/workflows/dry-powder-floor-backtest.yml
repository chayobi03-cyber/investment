name: Dry Powder 28% floor backtest
on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run Dry Powder floor backtest
        run: python research/scripts/run_dry_powder_floor_backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: dry-powder-floor-backtest-results
          path: research/results/dry_powder_floor_backtest/
