name: crypto-entry-live-monitor

on:
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test push to the phone regardless of state"
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "scripts/crypto/live_entry_snapshot.py"
      - ".github/workflows/crypto-entry-live-monitor.yml"
      - "src/investment_pipeline/crypto_entry.py"
      - "requirements.txt"
      - "scripts/crypto/push/**"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build v0.2 fail-closed live snapshot
        env:
          PYTHONPATH: .
        run: |
          python scripts/crypto/live_entry_snapshot.py \
            --output artifacts/crypto/live_entry.json

      - name: Publish compact state
        run: |
          python - <<'PY'
          import json
          d = json.load(open("artifacts/crypto/live_entry.json", encoding="utf-8"))
          print("CRYPTO_ENTRY_STATE=" + d["daily_core_state"])
          print("DAILY_ZONE=" + d["daily_zone"])
          print("LIVE_ZONE=" + d["live_zone"])
          print("LIVE_PRICE=" + str(d["live_price"]))
          print("BUY_ALLOWED=" + str(d["buy_allowed"]))
          print("ACTION=" + d["action"])
          print("THRESHOLD_EVIDENCE=" + d["promotion_gate"]["threshold_evidence"])
          print("FULL_PERMISSION=" + d["promotion_gate"]["full_buy_permission"])
          PY

      - name: Restore push dedupe state
        uses: actions/cache/restore@v4
        with:
          path: .state/push_state.json
          key: push-state-${{ github.run_id }}
          restore-keys: push-state-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Push B3+ alert to phone
        env:
          WEBPUSH_SUBSCRIPTIONS: ${{ secrets.WEBPUSH_SUBSCRIPTIONS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          npm ci --prefix scripts/crypto/push --no-audit --no-fund
          node scripts/crypto/push/send_entry_push.mjs \
            --snapshot artifacts/crypto/live_entry.json \
            --state .state/push_state.json \
            ${{ inputs.test_push && '--test' || '' }}

      - name: Save push dedupe state
        if: hashFiles('.state/push_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state/push_state.json
          key: push-state-${{ github.run_id }}

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: crypto-entry-live-${{ github.run_id }}
          path: artifacts/crypto/live_entry.json
          retention-days: 7