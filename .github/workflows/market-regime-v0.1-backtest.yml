name: market regime v0.1 exploratory backtest
on:
  push:
    branches: [ main, claude/market-judgment-validation-framework-je5603 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests tabulate
      - name: Run market regime v0.1 exploratory backtest
        run: python research/scripts/run_market_regime_v0.1_backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: market-regime-v0.1-backtest-results
          path: research/results/market_regime_v0.1/
      - name: Run KOSPI 2026 case study
        run: python research/scripts/run_kr_2026_case_study.py
      - name: Upload KOSPI 2026 case study results
        uses: actions/upload-artifact@v4
        with:
          name: kr-2026-case-study-results
          path: research/results/kr_2026_case_study/
