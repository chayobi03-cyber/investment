name: Historical PIT + P0-P6 Research

on:
  pull_request:
    paths:
      - "scripts/market_monitor/**"
      - "tests/test_market_monitor_pit_p0p6.py"
      - ".github/workflows/historical-p0-p6-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR/head
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt yfinance

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_market_monitor_pit_p0p6.py tests/test_decision_pipeline.py

      - name: Build historical PIT v3 research panel
        env:
          PYTHONPATH: .
        run: |
          rm -rf artifacts/historical_pit_v3
          python scripts/market_monitor/build_historical_pit_v3.py             --out artifacts/historical_pit_v3             --workers 5

      - name: Run episode-clustered P0-P6 backtest
        env:
          PYTHONPATH: .
        run: |
          python scripts/market_monitor/p0_p6_backtest.py             artifacts/historical_pit_v3/p0p6_events.jsonl             --manifest artifacts/historical_pit_v3/manifest.json             --output artifacts/historical_pit_v3/p0p6_backtest.json
          cat artifacts/historical_pit_v3/p0p6_backtest.json

      - name: Upload PIT and backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historical-pit-p0-p6-${{ github.run_id }}
          path: artifacts/historical_pit_v3
          if-no-files-found: error
          retention-days: 14
