name: crypto-market-regime-p0-p6-v0-2

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/investment_pipeline/crypto_entry.py"
      - "src/investment_pipeline/crypto_risk.py"
      - "src/investment_pipeline/crypto_permission.py"
      - "src/investment_pipeline/signal_decomposition_agent.py"
      - "scripts/crypto/run_crypto_p0_p6_v0_2.py"
      - "scripts/crypto/run_crypto_decomposition_v0_2.py"
      - "scripts/crypto/fetch_btc_daily.py"
      - "tests/test_crypto_entry.py"
      - "tests/test_crypto_risk_engine.py"
      - "tests/test_crypto_permission_overlay.py"
      - "tests/test_crypto_decomposition.py"
      - "config/crypto_market_regime_entry_v0.2.json"
      - "schemas/crypto_p0_p6_v0.2.schema.json"
      - ".github/workflows/crypto-market-regime-p0-p6-v0-2.yml"
  schedule:
    - cron: "45 1 * * *"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_crypto_entry.py \
            tests/test_crypto_risk_engine.py \
            tests/test_crypto_permission_overlay.py \
            tests/test_crypto_decomposition.py \
            tests/test_signal_decomposition_agent.py

      - name: Fetch BTC PIT daily history
        run: |
          rm -rf artifacts/crypto
          python scripts/crypto/fetch_btc_daily.py \
            --days 3000 \
            --out artifacts/crypto/btc_1d_pit.csv

      - name: Run frozen v0.2 chronological backtest OOS walk-forward
        env:
          PYTHONPATH: .
        run: |
          python scripts/crypto/run_crypto_p0_p6_v0_2.py \
            artifacts/crypto/btc_1d_pit.csv \
            --output artifacts/crypto/crypto_p0_p6_v0.2.json
          cat artifacts/crypto/crypto_p0_p6_v0.2.json

      - name: Run frozen threshold decomposition
        env:
          PYTHONPATH: .
        run: |
          python scripts/crypto/run_crypto_decomposition_v0_2.py \
            artifacts/crypto/btc_1d_pit.csv \
            --output artifacts/crypto/crypto_decomposition_v0.2.json
          cat artifacts/crypto/crypto_decomposition_v0.2.json

      - name: Validate artifact schema presence
        run: |
          test -s artifacts/crypto/crypto_p0_p6_v0.2.json
          test -s artifacts/crypto/crypto_decomposition_v0.2.json
          python - <<'PY'
          import json
          p = json.load(open("artifacts/crypto/crypto_p0_p6_v0.2.json", encoding="utf-8"))
          required = ["p0","p1","p2","p3","p4","p5","p6","threshold_validation"]
          missing = [x for x in required if x not in p]
          if missing:
              raise SystemExit("missing_artifact_fields:" + ",".join(missing))
          assert p["rule_version"] == "crypto-market-regime-entry-v0.2"
          assert p["p6"]["threshold_retuned"] is False
          assert p["permission"]["buy_allowed"] is False
          assert p["permission"]["execution_gate"] == "DISABLED"

          d = json.load(open("artifacts/crypto/crypto_decomposition_v0.2.json", encoding="utf-8"))
          assert d["threshold_retuned"] is False
          assert d["rule_version"] == "crypto-market-regime-entry-v0.2"
          assert "fixed_oos" in d
          assert "market_regime" in d
          PY

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crypto-market-regime-p0-p6-v0-2-${{ github.run_id }}
          path: artifacts/crypto
          if-no-files-found: error
          retention-days: 30
