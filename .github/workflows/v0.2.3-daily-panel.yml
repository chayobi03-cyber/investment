name: v0.2.3 daily panel backtest
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests tabulate
      - name: Run 11-window daily panel
        run: python research/scripts/run_v0.2.3_daily_panel.py
      - name: Print results
        run: |
          echo '=== SUMMARY METRICS ==='
          cat research/results/v0.2.3_daily_panel/summary_metrics.csv
          echo '=== WINDOW-STAGE RESULTS ==='
          cat research/results/v0.2.3_daily_panel/window_stage_results.csv
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: v0.2.3-daily-panel-results
          path: research/results/v0.2.3_daily_panel/
