name: crypto-entry-timing

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/investment_pipeline/crypto_entry.py"
      - "scripts/crypto/**"
      - "tests/test_crypto_entry.py"
      - "config/crypto_entry_timing_v0.1.json"
      - "docs/investment/CRYPTO_ENTRY_TIMING_V0.1.md"
      - ".github/workflows/crypto-entry-timing.yml"
  schedule:
    - cron: "35 1 * * *"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_crypto_entry.py tests/test_crypto_risk_engine.py

      - name: Fetch BTC PIT daily history
        run: |
          python scripts/crypto/fetch_btc_daily.py             --days 3000             --out artifacts/crypto/btc_1d_pit.csv

      - name: Run P0-P5 entry timing research
        env:
          PYTHONPATH: .
        run: |
          python scripts/crypto/run_btc_entry_backtest.py             artifacts/crypto/btc_1d_pit.csv             --output artifacts/crypto/btc_entry_backtest.json

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crypto-entry-timing-${{ github.run_id }}
          path: artifacts/crypto
          retention-days: 14
