name: multi-asset-subagents-ci

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/investment_pipeline/multi_asset_subagents.py"
      - "src/investment_pipeline/asset_signal_contract.py"
      - "src/investment_pipeline/hallucination_guard_agent.py"
      - "src/investment_pipeline/source_retrieval_agent.py"
      - "src/investment_pipeline/source_quality_agent.py"
      - "src/investment_pipeline/conflict_detection_agent.py"
      - "tests/test_multi_asset_subagents.py"
      - "tests/test_asset_signal_contract.py"
      - "tests/test_hallucination_guard_agent.py"
      - "tests/test_claim_contract.py"
      - "tests/test_source_retrieval_agent.py"
      - "tests/test_source_quality_agent.py"
      - "tests/test_conflict_detection_agent.py"
      - "config/multi_asset_subagents_v0.1.json"
      - "schemas/hallucination_guard_v0.1.schema.json"
      - "schemas/multi_asset_decision_v0.1.schema.json"
      - ".github/workflows/multi-asset-subagents-ci.yml"

permissions:
  contents: read

jobs:
  subagents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Contract JSON
        run: |
          python - <<'PY'
          import json
          for p in [
              "config/multi_asset_subagents_v0.1.json",
              "schemas/hallucination_guard_v0.1.schema.json",
              "schemas/multi_asset_decision_v0.1.schema.json",
          ]:
              json.load(open(p, encoding="utf-8"))
          cfg = json.load(open("config/multi_asset_subagents_v0.1.json", encoding="utf-8"))
          assert cfg["global_controls"]["buy_allowed"] is False
          assert cfg["global_controls"]["execution_allowed"] is False
          assert cfg["global_controls"]["threshold_mutation_allowed"] is False
          assert cfg["global_controls"]["hallucination_guard_required"] is True
          print("contract=PASS")
          PY

      - name: Unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_multi_asset_subagents.py \
            tests/test_asset_signal_contract.py \
            tests/test_hallucination_guard_agent.py \
            tests/test_claim_contract.py \
            tests/test_source_retrieval_agent.py \
            tests/test_source_quality_agent.py \
            tests/test_conflict_detection_agent.py

      - name: Import smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.investment_pipeline.multi_asset_subagents import MultiAssetOrchestrator
          from src.investment_pipeline.hallucination_guard_agent import HallucinationGuardAgent
          from src.investment_pipeline.source_retrieval_agent import SourceRetrievalAgent
          from src.investment_pipeline.source_quality_agent import SourceQualityAgent
          from src.investment_pipeline.conflict_detection_agent import ConflictDetectionAgent
          assert MultiAssetOrchestrator()
          assert HallucinationGuardAgent()
          assert SourceRetrievalAgent()
          assert SourceQualityAgent()
          assert ConflictDetectionAgent()
          print("imports=PASS")
          PY
